# ==============================================================================
# Dolphin Hyprland - Lockscreen Style 2
# ==============================================================================

# Variables y colores
source = ~/.config/hypr/configs/configs.conf

# Fondo con desenfoque y color de respaldo inmediato
background {
    monitor =
    path = $HOME/.config/hypr/.cache/current_wallpaper.png
    color = rgba(13, 17, 23, 1.0)
    blur_passes = 2
    contrast = 1
    brightness = 0.9
    vibrancy = 1
    vibrancy_darkness = 0.0
}

# GENERAL (Renderizado Inmediato y Tolerancia a Fallos)
general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = false
    immediate_render = true
}

# Campo de contraseña en esquina inferior derecha
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $act_border
    inner_color = $act_border
    font_color = $inact_border
    fade_on_empty = false
    fade_timeout = 2000
    placeholder_text = <i> <span foreground="##000000"> Enter Password...</span> </i>
    hide_input = false
    rounding = -1
    check_color = rgba(d3d4e6FF)
    fail_color = rgba(255, 0, 0, 1)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgba(d3d4e6FF)
    numlock_color = rgba(d3d4e6FF)
    bothlock_color = rgba(d3d4e6FF)
    invert_numlock = false
    swap_font_color = $act_border
    position = -40, 40
    halign = right
    valign = bottom
}

# Hora grande (Hora)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I')"
    color = $act_border
    font_size = 200
    font_family = Montserrat Italic Bold, Montserrat, sans-serif
    position = -50, 250
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

# Hora grande (Minutos)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M')"
    color = $act_border
    font_size = 170
    font_family = Montserrat Italic Bold, Montserrat, sans-serif
    position = 50, 70
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

# Fecha cursiva estilizada
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%d %B, %Y')"
    color = $act_border
    font_size = 25
    font_family = Pacifico Regular, Pacifico, cursive
    position = 0, -75
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

# Nombre de usuario
label {
    monitor =
    text = $USER
    color = $act_border
    font_size = 40
    font_family = Fira Bold, Fira Sans, sans-serif
    position = -50, 120
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# Avatar circular del usuario
image {
    monitor =
    path = $HOME/.config/hypr/.cache/user.png
    size = 280
    rounding = -1
    border_size = 8
    border_color = $act_border
    rotate = 0
    reload_time = -1
    position = -45, 190
    halign = right
    valign = bottom
}
