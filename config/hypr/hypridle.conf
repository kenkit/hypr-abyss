# ==============================================================================
# Hypridle Configuration - Auto-lock & Power Management Daemon
# Basado en la lógica avanzada y economizador de Dolphin-Hyprland
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    # Evita suspender o bloquear la pantalla si hay contenido multimedia reproduciéndose (videos/música)
    ignore_dbus_inhibit = false
}

# 1. ECONOMIZADOR DE BATERÍA (A los 90s de inactividad, atenúa el brillo)
listener {
    timeout = 90
    on-timeout = brightnessctl -s set 15
    on-resume = brightnessctl -r
}

# Apagar luces del teclado si existen para ahorrar energía (A los 90s)
listener {
    timeout = 90
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

# 2. AVISO PREVIO DE BLOQUEO (A los 4 minutos y medio / 270s)
listener {
    timeout = 270
    on-timeout = notify-send "Screen Lock" "Session will lock in 30 seconds due to inactivity..." -i dialog-information
}

# 3. BLOQUEO DE SESIÓN Y APAGADO DE PANTALLA (A los 5 minutos / 300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. SUSPENSIÓN PROFUNDA (A los 10 minutos / 600s)
listener {
    timeout = 600
    on-timeout = systemctl suspend 2>/dev/null || loginctl suspend 2>/dev/null
}
